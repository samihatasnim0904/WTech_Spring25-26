<!DOCTYPE html>
<html>
    <title> Contact </title>
    <body>
        <link rel="stylesheet" href="..\Design\Style.css">
    <head>
        <h1> Contact Us </h1>
    </head>

    <script src="..\JavaScript\Script.js">

    </script>



    <form onsubmit="return collect_data()">
        <table> 
            <tr><label for ="FirstName">FIRST NAME </label><br><br></tr>
            <td><input type ="text" id="FirstName" name ="FirstName"  onclick= "return collect_data()"><br><br></td>

            <tr><label for ="LastName">LAST NAME </label><br><br></tr>
            <td><input type ="text" id="LastName" name ="LastName"  onclick= "return collect_data()"><br><br></td>

            <tr><label for ="Email">EMAIL </label><br><br></tr>
            <td><input type ="text" id="Email" name ="Email"  onclick= "return collect_data()"><br><br></td>

            <tr><label for ="Phone">PHONE NUMBER </label><br><br></tr>
            <td><input type ="text" id="Phone" name ="Phone"  onclick= "return collect_data()"><br><br></td>


            <tr><label for="Mind">WHAT DO YOU HAVE IN THE MIND </label><br><br></tr>
            <td><textarea id="Mind" name ="Mind" rows="4" cols="30" onkeyup="return get_textarea()"></textarea></td>

        </table>




        <button id ="keysubmit" onclick="return submit_key()"> SUBMIT</button>
        

    </form>
</body>
</html>
