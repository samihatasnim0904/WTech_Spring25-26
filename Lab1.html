<!DOCTYPE html>
<html lang="en">
<head>

    <title>Student Registration Page</title>
</head>


<body>

    <h1>Student Registration Page</h1>

    <form>

        <label for="StudentName">Student Name:</label>
        <input type="text" id="name" placeholder="Enter Your Name"><br><br>

        <label for="StudentCGPA">Student CGPA:</label>
        <input type="text" id="cgpa" placeholder="Enter Your CGPA"><br><br>

        <label for="Gender">Gender:</label><br>
        <input type="radio" id="Male" name="gender"> Male<br>
        <input type="radio" id="Female" name="gender"> Female<br><br>

        <label for="Depertment">Select Department:</label>
        <select>
            <option value="Default"></option>
            <option>CSE</option>
            <option>EEE</option>
            <option>BBA</option>
            <option>LAW</option>
        </select><br><br>

        <label for="StudentID">Student ID:</label>
        <input type="text" id="studentid" name="StudentID"><br><br>

        <label for="Adderss">Address: </label>
        <textarea id="Address" name="PatientAddress" rows="4" cols="30" placeholder="Enter the address"></textarea><Br></Br>

        <label for="DOB">Date of Birth:</label>
        <input type="date" id="DOB" name="PatientDOB"><Br></Br>

        <label for="Email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>

        <label for="GradeUpload">Upload your Grade Report:</label>
        <input type="file" id="GradeUpload" name="insertgradefile"><br><br>

        <label for="terms">I agree to the terms and conditions</label>
        <input type="checkbox" id="checkbox" name="checkbox">
        <br><br>

        <label for="phonenumber">Phone Number:</label>
        <input type="text"id= "Phomenumber" name="Phomenumber" placeholder="Enter your phone number"><br><br>

        <label for="">Submit your information</label><br>
        <input type="submit" id="submit" name="DataSubmit">

    </form>

</body>
</html>
